name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PESTER_MIN_VERSION: '5.5.0'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: PowerShell syntax validation (fast, no dependencies)
  # ──────────────────────────────────────────────────────────────
  syntax-check:
    name: Syntax Validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -Include '*.ps1','*.psm1','*.psd1' -Path . |
                   Where-Object { $_.FullName -notmatch '\\\.git\\' }

          $errors = 0
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw
            $tokens  = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $content, [ref]$tokens, [ref]$parseErrors) | Out-Null

            if ($parseErrors.Count -gt 0) {
              Write-Host "SYNTAX ERROR: $($file.FullName)" -ForegroundColor Red
              $parseErrors | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
              $errors++
            } else {
              Write-Host "OK: $($file.FullName)" -ForegroundColor Green
            }
          }

          if ($errors -gt 0) {
            throw "$errors file(s) have syntax errors."
          }
          Write-Host "`nAll $($files.Count) PowerShell files passed syntax validation." -ForegroundColor Cyan

  # ──────────────────────────────────────────────────────────────
  # Job 2: PSScriptAnalyzer linting
  # ──────────────────────────────────────────────────────────────
  lint:
    name: PSScriptAnalyzer Lint
    runs-on: windows-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -MinimumVersion 1.21.0

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error `
                     -ExcludeRule PSAvoidUsingWriteHost `
                     -ErrorAction Stop

          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            Write-Host "$($results.Count) issue(s) found." -ForegroundColor Yellow
            # Fail only on Error severity
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors.Count -gt 0) {
              throw "$($errors.Count) PSScriptAnalyzer error(s) found."
            }
          } else {
            Write-Host "No PSScriptAnalyzer issues found." -ForegroundColor Green
          }

  # ──────────────────────────────────────────────────────────────
  # Job 3: Configuration validation
  # ──────────────────────────────────────────────────────────────
  config-validate:
    name: Configuration Validation
    runs-on: windows-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jsonFiles = Get-ChildItem -Recurse -Include '*.json' -Path . |
                       Where-Object { $_.FullName -notmatch '\\\.git\\' }

          $errors = 0
          foreach ($file in $jsonFiles) {
            try {
              Get-Content $file.FullName -Raw | ConvertFrom-Json | Out-Null
              Write-Host "OK: $($file.FullName)" -ForegroundColor Green
            } catch {
              Write-Host "INVALID JSON: $($file.FullName) — $_" -ForegroundColor Red
              $errors++
            }
          }

          if ($errors -gt 0) { throw "$errors JSON file(s) are invalid." }

      - name: Validate tool registry completeness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\modules\Core\Config.ps1
          $registry = Get-ToolRegistry

          $required = @('id','name','command','packageManager','packageId')
          foreach ($tool in $registry) {
            foreach ($field in $required) {
              if (-not $tool.$field) {
                throw "Tool '$($tool.id ?? 'UNKNOWN')' missing required field: $field"
              }
            }
          }
          Write-Host "All $($registry.Count) tool entries are valid." -ForegroundColor Green

      - name: Validate profiles resolve correctly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\modules\Core\Config.ps1

          $profiles = Get-AllProfileNames
          foreach ($p in $profiles) {
            $resolved = Get-Profile -ProfileName $p
            Write-Host "Profile '$p': $($resolved.Tools.Count) tools" -ForegroundColor Green
          }
          Write-Host 'All profiles resolved successfully.' -ForegroundColor Cyan

  # ──────────────────────────────────────────────────────────────
  # Job 4: Pester unit tests
  # ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Pester)
    runs-on: windows-latest
    needs: [syntax-check, config-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion $env:PESTER_MIN_VERSION

      - name: Run unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path         = '.\tests\unit'
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled    = $true
          $config.TestResult.OutputPath = 'TestResults-Unit.xml'
          $config.TestResult.OutputFormat = 'JUnitXml'

          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) unit test(s) failed."
          }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults-Unit.xml

  # ──────────────────────────────────────────────────────────────
  # Job 5: Integration tests (dry-run only — safe on CI)
  # ──────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Dry-Run)
    runs-on: windows-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -MinimumVersion $env:PESTER_MIN_VERSION

      - name: Run integration tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path         = '.\tests\integration'
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled    = $true
          $config.TestResult.OutputPath = 'TestResults-Integration.xml'
          $config.TestResult.OutputFormat = 'JUnitXml'

          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) integration test(s) failed."
          }

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults-Integration.xml

  # ──────────────────────────────────────────────────────────────
  # Job 6: Security scan — check for accidentally committed secrets
  # ──────────────────────────────────────────────────────────────
  security-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ──────────────────────────────────────────────────────────────
  # Job 7: Documentation check
  # ──────────────────────────────────────────────────────────────
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required docs exist
        run: |
          required_files=(
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "CODE_OF_CONDUCT.md"
            "CHANGELOG.md"
            "docs/architecture.md"
            "docs/installation.md"
            "docs/development.md"
            "docs/troubleshooting.md"
            "docs/roadmap.md"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ -f "$f" ] || [ -f "$(echo "$f" | tr '[:upper:]' '[:lower:]')" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
              missing=$((missing+1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "$missing required file(s) are missing."
            exit 1
          fi
